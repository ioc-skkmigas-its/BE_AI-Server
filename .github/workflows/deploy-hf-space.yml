name: CI and Deploy to Hugging Face Space

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hf_space_repo:
        description: Hugging Face Space repo in owner/name format
        required: false
        default: XRyZ/ioc-migas
      include_data:
        description: Include tracked data/ directory in deploy mirror
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hf-space-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -q tests/test_ranking_service.py

  deploy:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    env:
      HF_SPACE_REPO: ${{ github.event.inputs.hf_space_repo || vars.HF_SPACE_REPO || 'XRyZ/ioc-migas' }}
      INCLUDE_DATA: ${{ github.event.inputs.include_data || vars.HF_INCLUDE_DATA || 'true' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secret
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing secret HF_TOKEN. Add it in GitHub repository settings."
            exit 1
          fi
          echo "::add-mask::$HF_TOKEN"

      - name: Validate deploy files
        run: |
          test -f README.md
          test -f Dockerfile
          test -f requirements.txt
          test -f main.py

      - name: Build deploy mirror without blocked binaries
        run: |
          set -euo pipefail
          DEPLOY_DIR="${RUNNER_TEMP}/hf-space-deploy"
          rm -rf "${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_DIR}"
          RSYNC_ARGS=(
            -a
            --delete
            --exclude ".git/"
            --exclude ".venv/"
            --exclude ".pytest_cache/"
            --exclude "__pycache__/"
            --exclude "*.zip"
            --exclude "*.pkl"
            --exclude "*.ubj"
            --exclude "*.bst"
          )

          if [ "${INCLUDE_DATA}" != "true" ]; then
            RSYNC_ARGS+=(--exclude "data/")
            echo "Including data/: no"
          else
            echo "Including data/: yes (binary model artifacts still excluded)"
          fi

          rsync "${RSYNC_ARGS[@]}" ./ "${DEPLOY_DIR}/"
          echo "DEPLOY_DIR=${DEPLOY_DIR}" >> "$GITHUB_ENV"

      - name: Push deploy mirror to Hugging Face Space
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          git init
          git checkout -b main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Deploy ${GITHUB_SHA} from ${GITHUB_REPOSITORY}" || true
          REMOTE_URL="https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git push "${REMOTE_URL}" main:main --force

      - name: Deployment summary
        run: |
          echo "Deployed commit ${GITHUB_SHA} to https://huggingface.co/spaces/${HF_SPACE_REPO}" >> "$GITHUB_STEP_SUMMARY"
